body{margin:0}

<style>
.apptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:10px}
.apptabs a{padding:6px 0 8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.apptabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.apptabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<body>
<title>日本史題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄窄版，像一本考前講義；藍墨為主色，朱色只用於答錯 */
:root{
  --bg:#eef0ee; --surface:#fbfbfa; --ink:#1c2230; --muted:#5b6474; --line:#d6dad6;
  --accent:#27467a; --accent-ink:#ffffff; --accent-soft:#e2e8f3;
  --ok:#2c7650; --ok-soft:#e1efe6; --bad:#b03c2b; --bad-soft:#f6e3df;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161c; --surface:#1b1f27; --ink:#e5e8ee; --muted:#9aa3b2; --line:#2d333e;
  --accent:#8eaee6; --accent-ink:#10141b; --accent-soft:#232c3c;
  --ok:#6cc292; --ok-soft:#1d2e25; --bad:#ee8b78; --bad-soft:#3a2420; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1b1f27; --ink:#e5e8ee; --muted:#9aa3b2; --line:#2d333e;
  --accent:#8eaee6; --accent-ink:#10141b; --accent-soft:#232c3c;
  --ok:#6cc292; --ok-soft:#1d2e25; --bad:#ee8b78; --bad-soft:#3a2420; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
#home,#quiz,#result{width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,.serif{font-family:var(--serif);font-weight:700;text-wrap:balance}
h1{font-size:clamp(28px,6vw,38px);line-height:1.2;margin:0;letter-spacing:.02em}
h2{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
/* 統計 */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.fig b small{font-size:15px;color:var(--muted);font-weight:500}
.fig span{font-size:13px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .bad{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--line)}
.legend .lo::before{background:var(--ok)} .legend .lb::before{background:var(--bad)}
.chap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0}
.chap .t{font-weight:500;min-width:0;grid-column:1/-1}
.chap .d{color:var(--muted);font-size:13px;min-width:0}
.chap .n{text-align:right;font-size:13px;color:var(--muted)}
.chap .bar{grid-column:1/-1;margin-top:6px}
/* 設定 */
.opt{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,.choice:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:500;padding:11px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}
.textlink{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}
/* 作答 */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qtop .bar{flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta span{border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.qtext{font-family:var(--serif);font-size:clamp(18px,4.4vw,21px);line-height:1.65;margin:4px 0 0;font-weight:500}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{font:inherit;text-align:left;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{color:var(--bad)}
.fill{display:flex;gap:10px;flex-wrap:wrap}
.fill input{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb p{margin:0}
.fb .exp{color:var(--ink)}
.kbd{font-size:12px;color:var(--muted)}
/* 結果 */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--serif);font-size:52px;line-height:1}
.miss{display:flex;flex-direction:column;gap:0}
.miss .it{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.miss .it:first-child{border-top:0}
.miss .q{font-family:var(--serif);font-weight:500}
.miss .a{font-size:14px}
.miss .a em{font-style:normal;color:var(--bad)}
.miss .a strong{color:var(--ok);font-weight:500}
.miss .e{font-size:14px;color:var(--muted)}
@media (max-width:480px){
  .figs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fig b{font-size:24px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

<div class="wrap">
  <header>
    <h1>日本史題庫</h1>
    <nav class="apptabs" aria-label="切換頁面"><a href="./" aria-current="page">題庫</a><a href="nenpyo.html">年表</a></nav>
  </header>

  <!-- 首頁 -->
  <div id="home" class="wrap" style="gap:28px">
    <section>
      <div class="label">開始測驗</div>
      <div class="panel" style="display:flex;flex-direction:column;gap:18px">
        <div id="resumeBox" class="row" hidden>
          <button class="btn" id="resumeBtn">繼續上一輪</button>
          <span class="note num" id="resumeInfo"></span>
        </div>
        <div class="opt"><div class="label">範圍</div><div class="chips" id="optChap"></div></div>
        <div class="opt"><div class="label">題型</div><div class="chips" id="optType"></div></div>
        <div class="opt"><div class="label">出題方式</div><div class="chips" id="optMode"></div></div>
        <div class="opt"><div class="label">題數</div><div class="chips" id="optCount"></div></div>
        <div class="row">
          <button class="btn" id="startBtn">開始</button>
          <span class="note num" id="poolInfo"></span>
        </div>
      </div>
    </section>

    <section>
      <div class="label">我的進度</div>
      <div class="panel" style="display:flex;flex-direction:column;gap:16px">
        <div class="figs">
          <div class="fig"><b class="num" id="sDone">0</b><span id="sDoneSub">已做</span></div>
          <div class="fig"><b class="num" id="sRight">0</b><span id="sRightSub">答對</span></div>
          <div class="fig"><b class="num" id="sWrong">0</b><span>待複習</span></div>
        </div>
        <div class="bar" id="sBar"><i class="ok"></i><i class="bad"></i></div>
        <div class="legend"><span class="lo">目前答對</span><span class="lb">上次答錯</span><span>還沒做</span></div>
        <p class="note num" id="sAcc"></p>
      </div>
    </section>

    <section>
      <div class="label">各講進度</div>
      <div class="panel" id="chapters" style="padding-block:6px"></div>
    </section>

    <div class="row" id="resetRow">
      <button class="textlink" id="resetBtn">清除所有作答紀錄</button>
      <span id="resetConfirm" hidden class="row">
        <span class="note">確定清除？無法復原。</span>
        <button class="btn quiet" id="resetYes" style="padding:6px 12px">清除</button>
        <button class="btn quiet" id="resetNo" style="padding:6px 12px">取消</button>
      </span>
    </div>
  </div>

  <!-- 作答 -->
  <div id="quiz" class="wrap" style="gap:20px" hidden>
    <div class="qtop">
      <span class="num" id="qPos" style="font-weight:500"></span>
      <div class="bar" id="qBar"><i class="ok"></i><i class="bad"></i></div>
      <span class="num note" id="qScore"></span>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:16px">
      <div class="meta" id="qMeta"></div>
      <p class="qtext" id="qText"></p>
      <div id="qBody"></div>
      <div id="qFb" hidden></div>
      <div class="row" id="qNav" hidden>
        <button class="btn" id="nextBtn">下一題</button>
      </div>
    </div>
    <div class="row"><button class="btn quiet" id="quitBtn">結束這一輪</button></div>
  </div>

  <!-- 結果 -->
  <div id="result" class="wrap" style="gap:24px" hidden>
    <section>
      <div class="label">本輪成績</div>
      <div class="panel" style="display:flex;flex-direction:column;gap:14px">
        <div class="score"><b class="num" id="rScore"></b><span class="note num" id="rAcc"></span></div>
        <div class="bar" id="rBar"><i class="ok"></i><i class="bad"></i></div>
        <div class="row">
          <button class="btn" id="againBtn">再來一輪</button>
          <button class="btn ghost" id="redoBtn">重做本輪錯題</button>
          <button class="btn quiet" id="homeBtn">回首頁</button>
        </div>
      </div>
    </section>
    <section id="missSec">
      <div class="label">答錯的題目</div>
      <div class="panel miss" id="missList"></div>
    </section>
  </div>
</div>

<script>
// 日本史題庫：m(章, 題目, [正解, 誘答...], 說明)  f(章, 題目, [可接受答案...], 說明)
// 章：0 課程導論  1 繩文・彌生・邪馬台國  2 古墳・飛鳥・大化改新  3 奈良  4 平安  5 跨章綜合
const Q = [];
const m = (c, q, o, e) => Q.push({ c, t: 'm', q, o, e });
const f = (c, q, a, e) => Q.push({ c, t: 'f', q, a, e });

/* ───────── 0 課程導論（9/15）───────── */
m(0,'本課程「日本史：1868 年以前」的終點 1868 年，是哪個時代的開始？',['明治時代','江戶時代','大正時代','安土桃山時代'],'1868 年明治維新，進入明治時代（近代）。本課程處理的是這之前的日本史。');
m(0,'依講義的時代區分表，奈良時代開始於哪一年？',['710 年','794 年','645 年','1192 年'],'710 年遷都平城京，奈良時代開始；794 年遷都平安京，進入平安時代。');
f(0,'平安時代始於西元 ＿＿ 年（遷都平安京）。',['794'],'794 年桓武天皇遷都平安京（今京都）。');
f(0,'奈良時代始於西元 ＿＿ 年（遷都平城京）。',['710'],'710 年由藤原京遷都平城京。');
m(0,'講義時代表中，鎌倉時代開始的年份是？',['1192 年','1185 年','1333 年','1467 年'],'講義以 1192 年（鎌倉幕府成立）為鎌倉時代起點。1185 年是壇之浦之戰、平氏滅亡的年份。');
m(0,'下列哪一組時代屬於「中世」？',['鎌倉時代、室町時代','奈良時代、平安時代','安土桃山時代、江戶時代','明治時代、大正時代'],'古代：飛鳥、奈良、平安；中世：鎌倉、室町（含南北朝、戰國）；近世：安土桃山、江戶；近代：明治以後。');
m(0,'下列哪一組時代屬於「近世」？',['安土桃山時代、江戶時代','鎌倉時代、室町時代','飛鳥時代、奈良時代','大正時代、昭和時代'],'近世＝安土桃山（1568–）與江戶（1603–1868）。');
m(0,'下列哪一組時代屬於「古代」？',['奈良時代、平安時代','繩文時代、彌生時代','鎌倉時代、室町時代','江戶時代、明治時代'],'講義表中奈良、平安屬古代；繩文、彌生屬原始時代。');
m(0,'繩文時代、彌生時代在講義的時代區分中屬於哪一大段？',['原始時代','古代','中世','近世'],'講義表中舊石器、繩文、彌生屬「原始時代」，之後進入古代。');
m(0,'下列時代的先後順序何者正確？',['飛鳥→奈良→平安→鎌倉','奈良→飛鳥→平安→鎌倉','飛鳥→平安→奈良→鎌倉','古墳→奈良→飛鳥→平安'],'古墳→飛鳥→奈良（710）→平安（794）→鎌倉（1192）。');
m(0,'下列原始時代的順序何者正確？',['舊石器→繩文→彌生→古墳','繩文→舊石器→彌生→古墳','舊石器→彌生→繩文→古墳','繩文→彌生→舊石器→古墳'],'時代表的原始時代依序是舊石器→繩文（約 1 萬 2 千年前起）→彌生（西元前 3 世紀起），之後是 3 世紀起的古墳時代。');
m(0,'下列近代、現代年號的順序何者正確？',['明治→大正→昭和→平成→令和','明治→昭和→大正→平成→令和','大正→明治→昭和→令和→平成','明治→大正→平成→昭和→令和'],'1868 明治、1912 大正、1926 昭和、1989 平成、2019 令和。');
f(0,'令和時代始於西元 ＿＿ 年。',['2019'],'時代表最後一格：2019 年令和。現代年號依序為昭和（戰後）→平成 1989→令和 2019。');
f(0,'平成時代始於西元 ＿＿ 年。',['1989'],'1989 年昭和天皇過世，改元平成。');
f(0,'大正時代始於西元 ＿＿ 年。',['1912'],'1912 年明治天皇過世，改元大正。');
f(0,'昭和時代始於西元 ＿＿ 年。',['1926'],'1926 年大正天皇過世，改元昭和；1945 年戰後起算為現代。');
f(0,'江戶時代始於西元 ＿＿ 年。',['1603'],'1603 年德川家康開設江戶幕府，至 1868 年結束。');
m(0,'講義時代表以哪一年作為「現代」的起點？',['1945 年','1926 年','1989 年','1868 年'],'1945 年二戰結束為現代起點；明治、大正、昭和前期屬近代。');
m(0,'安土桃山時代始於哪一年？',['1568 年','1603 年','1467 年','1333 年'],'時代表標 1568 年為安土桃山時代起點，1603 年進入江戶時代。');
m(0,'1467 年在時代表中標記的是哪一時期的開端？',['戰國時代','南北朝時代','安土桃山時代','鎌倉時代'],'1467 年應仁之亂爆發，進入戰國時代（室町時代後半）。');
m(0,'1333 年在時代表中代表什麼？',['鎌倉時代結束，進入南北朝・室町','平安時代結束','江戶時代開始','戰國時代開始'],'1333 年鎌倉幕府滅亡，之後為南北朝與室町時代。');
m(0,'依時代表，彌生時代大約開始於何時？',['西元前 3 世紀','約 1 萬 2 千年前','西元 3 世紀','西元 7 世紀'],'繩文約 1 萬 2 千年前起，彌生約西元前 3 世紀起，古墳約 3 世紀起。');
m(0,'日語「幕府」的讀音是？',['ばくふ（bakufu）','しょうぐん（shogun）','てんのう（tenno）','じだい（jidai）'],'幕府＝ばくふ；将軍＝しょうぐん；天皇＝てんのう；時代＝じだい。');
m(0,'「しょうぐん」對應的漢字是？',['将軍','幕府','天皇','時代'],'将軍＝しょうぐん（syogun），幕府的首長。幕府＝ばくふ，天皇＝てんのう。');
m(0,'「中世」的日語讀音是？',['ちゅうせい','きんせい','きんだい','こだい'],'古代こだい、中世ちゅうせい、近世きんせい、近代きんだい、現代げんだい。');
m(0,'「きんせい」指的是哪一個時代區分？',['近世','近代','現代','中世'],'近世（きんせい）＝安土桃山、江戶；近代（きんだい）＝明治以後。兩者讀音很像。');
m(0,'「きんだい」指的是哪一個時代區分？',['近代','近世','現代','古代'],'近代（きんだい）＝明治以後到 1945 年；近世（きんせい）是安土桃山、江戶。');
m(0,'「げんだい」是哪個詞？',['現代','近代','古代','原始'],'現代＝げんだい（gendai），講義時代表以 1945 年後為現代。');

f(1,'彌生時代用於儲存收穫、可防潮防鼠的建築稱為 ＿＿。',['高床式倉庫','高床倉庫','高床式'],'高床式倉庫用來儲存收穫的稻米，把地板架高以防潮防鼠，是稻作社會的象徵。');

<script>
(function(){
const CH = [
  {n:'課程導論', d:'9/15　時代區分・日語語彙・地方'},
  {n:'① 繩文・彌生・邪馬台國', d:'9/22'},
  {n:'② 古墳・飛鳥・大化改新', d:'9/29、10/6'},
  {n:'③ 奈良時代', d:'10/13、10/20'},
  {n:'④ 平安時代', d:'10/27、11/3'},
  {n:'跨章綜合', d:'比較與排序'}
];
const KEY='jh115-stats-v1', RKEY='jh115-round-v1', PKEY='jh115-prefs-v1';
const hash=s=>{let h=5381;for(const ch of s)h=((h<<5)+h+ch.codePointAt(0))>>>0;return h.toString(36)};
Q.forEach(q=>q.id=hash(q.t+q.q));
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=load(KEY,{});          // id -> {n:作答次數, c:答對次數, l:上次結果 1/0}
let P=Object.assign({ch:[0,1,2,3,4,5],type:'all',mode:'new',count:50},load(PKEY,{}));
let R=null;                  // 目前這一輪
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* 填空比對：統一繁簡日異體字、去掉標點空白 */
const VAR={'臺':'台','国':'國','弥':'彌','縄':'繩','徳':'德','来':'來','宝':'寶','実':'實','万':'萬','仮':'假','権':'權','摂':'攝','関':'關','将':'將','戦':'戰','乱':'亂','仏':'佛','浄':'淨','净':'淨','円':'圓','県':'縣','収':'收','発':'發','続':'續','伝':'傳','説':'說','奥':'奧','栄':'榮','頼':'賴','経':'經','懐':'懷','済':'濟','暦':'曆','峰':'峯','荘':'莊','庄':'莊','脚':'腳','広':'廣','楽':'樂','乐':'樂','丝':'絲','珍':'珎','蔵':'藏','壱':'壹','与':'與','鉄':'鐵','銭':'錢','黒':'黑','歳':'歲','ヶ':'','ケ':'','麿':'麻呂','墳':'墳','条':'條','帰':'歸','蘇':'蘇','学':'學','単':'單','証':'證','寿':'壽','観':'觀','辺':'邊','亜':'亞','両':'兩','譲':'讓','郷':'鄉','禅':'禪','髪':'髮','沢':'澤','渓':'溪','恵':'惠','産':'產','様':'樣','気':'氣','鳳':'鳳'};
const norm=s=>{s=String(s).normalize('NFKC').toLowerCase().replace(/[\s「」『』《》〈〉()（）【】、。・,.!?！？"'＿_\-－—~～:：;；]/g,'');
  s=s.replace(/^(西元|公元|紀元)/,'').replace(/年$/,'');
  return [...s].map(c=>c in VAR?VAR[c]:c).join('')};
const fillOk=(q,ans)=>{const a=norm(ans);return a.length>0&&q.a.some(x=>norm(x)===a)};

/* ── 首頁 ── */
function pool(){return Q.filter(q=>P.ch.includes(q.c)&&(P.type==='all'||q.t===P.type))}
function renderHome(){
  const done=Q.filter(q=>S[q.id]).length, right=Q.filter(q=>S[q.id]&&S[q.id].l===1).length, wrong=done-right;
  let tn=0,tc=0;Object.values(S).forEach(v=>{tn+=v.n;tc+=v.c});
  $('sDone').innerHTML=`${done}<small> / ${Q.length}</small>`;
  $('sDoneSub').textContent=`已做（${Math.round(done/Q.length*100)}%）`;
  $('sRight').innerHTML=`${right}<small> 題</small>`;
  $('sRightSub').textContent=done?`答對（${Math.round(right/done*100)}%）`:'答對';
  $('sWrong').innerHTML=`${wrong}<small> 題</small>`;
  setBar($('sBar'),right,wrong,Q.length);
  $('sAcc').textContent=tn?`累計作答 ${tn} 次，答對 ${tc} 次，整體正確率 ${Math.round(tc/tn*100)}%。「目前答對」以每題最近一次作答為準。`:'還沒有作答紀錄。做完的題目會記在這個瀏覽器裡。';
  $('chapters').innerHTML=CH.map((c,i)=>{
    const qs=Q.filter(q=>q.c===i), d=qs.filter(q=>S[q.id]).length, r=qs.filter(q=>S[q.id]&&S[q.id].l===1).length;
    return `<div class="chap"><div class="t">${c.n}</div><div class="d">${c.d}</div><div class="n num">${d} / ${qs.length}　對 ${r}</div><div class="bar"><i class="ok" style="width:${r/qs.length*100}%"></i><i class="bad" style="width:${(d-r)/qs.length*100}%"></i></div></div>`}).join('');
  renderOpts();
  const saved=load(RKEY,null);
  if(saved&&saved.ids&&saved.i<saved.ids.length&&saved.ids.every(id=>byId[id])){
    $('resumeBox').hidden=false;
    $('resumeInfo').textContent=`做到第 ${saved.i+1} / ${saved.ids.length} 題，已答對 ${saved.res.filter(x=>x.ok).length} 題`;
  } else $('resumeBox').hidden=true;
}
function setBar(el,ok,bad,total){const [a,b]=el.children;a.style.width=(total?ok/total*100:0)+'%';b.style.width=(total?bad/total*100:0)+'%'}
function chipGroup(el,items,isOn,onClick){
  el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='chip';b.type='button';
    b.textContent=it.label;b.setAttribute('aria-pressed',isOn(it.v));b.onclick=()=>{onClick(it.v);save(PKEY,P);renderOpts()};el.appendChild(b)})}
function renderOpts(){
  chipGroup($('optChap'),[{label:'全部',v:'all'}].concat(CH.map((c,i)=>({label:c.n,v:i}))),
    v=>v==='all'?P.ch.length===CH.length:P.ch.includes(v),
    v=>{if(v==='all')P.ch=P.ch.length===CH.length?[]:CH.map((_,i)=>i);else P.ch=P.ch.includes(v)?P.ch.filter(x=>x!==v):P.ch.concat(v).sort()});
  chipGroup($('optType'),[{label:'混合',v:'all'},{label:'只做選擇題',v:'m'},{label:'只做填空題',v:'f'}],v=>P.type===v,v=>P.type=v);
  chipGroup($('optMode'),[{label:'沒做過的優先',v:'new'},{label:'錯題複習',v:'wrong'},{label:'完全隨機',v:'rand'}],v=>P.mode===v,v=>P.mode=v);
  chipGroup($('optCount'),[{label:'20 題',v:20},{label:'50 題',v:50},{label:'100 題',v:100}],v=>P.count===v,v=>P.count=v);
  const p=pool(), n=pick().length;
  const unseen=p.filter(q=>!S[q.id]).length, wr=p.filter(q=>S[q.id]&&S[q.id].l===0).length;
  $('poolInfo').textContent=!p.length?'請至少選一個範圍':P.mode==='wrong'&&!wr?'這個範圍目前沒有答錯的題目':`範圍內 ${p.length} 題，沒做過 ${unseen} 題，待複習 ${wr} 題；本輪出 ${n} 題`;
  $('startBtn').disabled=!n;
}
function pick(){
  const p=pool();let list;
  if(P.mode==='wrong')list=shuffle(p.filter(q=>S[q.id]&&S[q.id].l===0));
  else if(P.mode==='rand')list=shuffle(p);
  else list=shuffle(p.filter(q=>!S[q.id])).concat(shuffle(p.filter(q=>S[q.id]&&S[q.id].l===0)),shuffle(p.filter(q=>S[q.id]&&S[q.id].l===1)));
  return list.slice(0,P.count);
}

/* ── 作答 ── */
function startRound(ids){R={ids,i:0,res:[],orders:{}};save(RKEY,R);show('quiz');renderQ()}
function show(v){['home','quiz','result'].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}
function curQ(){return byId[R.ids[R.i]]}
function renderQ(){
  const q=curQ(), n=R.ids.length, ok=R.res.filter(x=>x.ok).length;
  $('qPos').textContent=`第 ${R.i+1} / ${n} 題`;
  $('qScore').textContent=`答對 ${ok}`;
  setBar($('qBar'),ok,R.res.length-ok,n);
  $('qMeta').innerHTML=`<span>${CH[q.c].n}</span><span>${q.t==='m'?'選擇題':'填空題'}</span>`;
  $('qText').textContent=q.q;
  $('qFb').hidden=true;$('qNav').hidden=true;
  const body=$('qBody');
  if(q.t==='m'){
    if(!R.orders[q.id])R.orders[q.id]=shuffle(q.o.map((_,i)=>i));
    const ord=R.orders[q.id];
    body.innerHTML=`<div class="choices">${ord.map((oi,k)=>`<button class="choice" type="button" data-oi="${oi}"><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerM(+b.dataset.oi));
  } else {
    body.innerHTML=`<form class="fill" id="fillForm" autocomplete="off"><input id="fillIn" type="text" placeholder="輸入答案" aria-label="填空答案" enterkeyhint="done"><button class="btn" type="submit">送出</button></form>`;
    $('fillForm').onsubmit=e=>{e.preventDefault();if(!$('fillIn').value.trim())return;answerF($('fillIn').value)};
    setTimeout(()=>{try{$('fillIn').focus({preventScroll:true})}catch(e){}},0);
  }
}
function record(q,ok,given){
  const s=S[q.id]||{n:0,c:0,l:0};s.n++;if(ok)s.c++;s.l=ok?1:0;S[q.id]=s;save(KEY,S);
  R.res.push({id:q.id,ok,given});save(RKEY,R);
}
function answerM(oi){
  if(R.res.length>R.i)return;
  const q=curQ(), ok=oi===0;
  $('qBody').querySelectorAll('.choice').forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===0)b.classList.add('right');else if(v===oi)b.classList.add('wrong')});
  record(q,ok,q.o[oi]);feedback(q,ok);
}
function answerF(val){
  if(R.res.length>R.i)return;
  const q=curQ(), ok=fillOk(q,val), inp=$('fillIn');
  inp.disabled=true;inp.classList.add(ok?'right':'wrong');$('fillForm').querySelector('button').disabled=true;
  record(q,ok,val);feedback(q,ok);
}
function feedback(q,ok){
  const ans=q.t==='m'?q.o[0]:q.a[0];
  const alt=q.t==='f'&&q.a.length>1?`（也接受：${q.a.slice(1).map(esc).join('、')}）`:'';
  const fb=$('qFb');fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=ok
    ?`<p class="h">答對了</p>${q.t==='f'?`<p>答案：${esc(ans)}${alt}</p>`:''}${q.e?`<p class="exp">${esc(q.e)}</p>`:''}`
    :`<p class="h">答錯了</p><p>正確答案：<strong>${esc(ans)}</strong>${alt}</p>${q.e?`<p class="exp">說明：${esc(q.e)}</p>`:''}${q.t==='f'?`<p><button class="textlink" type="button" id="overrideBtn">我的答案其實正確（只是寫法不同）</button></p>`:''}`;
  const ob=$('overrideBtn');
  if(ob)ob.onclick=()=>{const s=S[q.id];s.c++;s.l=1;save(KEY,S);R.res[R.i].ok=true;save(RKEY,R);$('fillIn').classList.replace('wrong','right');fb.className='fb ok';fb.innerHTML=`<p class="h">已改判為答對</p><p>參考答案：${esc(ans)}${alt}</p>${q.e?`<p class="exp">${esc(q.e)}</p>`:''}`;const o=R.res.filter(x=>x.ok).length;$('qScore').textContent=`答對 ${o}`;setBar($('qBar'),o,R.res.length-o,R.ids.length)};
  const n=R.res.filter(x=>x.ok).length;$('qScore').textContent=`答對 ${n}`;setBar($('qBar'),n,R.res.length-n,R.ids.length);
  $('qNav').hidden=false;$('nextBtn').textContent=R.i+1<R.ids.length?'下一題':'看成績';
  try{$('nextBtn').focus({preventScroll:true})}catch(e){}
}
function next(){R.i++;save(RKEY,R);if(R.i<R.ids.length){renderQ();window.scrollTo(0,0)}else finish()}
function finish(){
  const done=R.res.length, ok=R.res.filter(x=>x.ok).length;
  try{localStorage.removeItem(RKEY)}catch(e){}
  $('rScore').textContent=`${ok} / ${done}`;
  $('rAcc').textContent=done?`正確率 ${Math.round(ok/done*100)}%`+(done<R.ids.length?`（本輪原定 ${R.ids.length} 題，提前結束）`:''):'這一輪還沒作答';
  setBar($('rBar'),ok,done-ok,done||1);
  const miss=R.res.filter(x=>!x.ok);
  $('missSec').hidden=!miss.length;
  $('missList').innerHTML=miss.map(x=>{const q=byId[x.id];const ans=q.t==='m'?q.o[0]:q.a[0];
    return `<div class="it"><div class="meta"><span>${CH[q.c].n}</span></div><div class="q">${esc(q.q)}</div><div class="a">你的答案：<em>${esc(x.given)}</em>　正確答案：<strong>${esc(ans)}</strong></div>${q.e?`<div class="e">${esc(q.e)}</div>`:''}</div>`}).join('');
  $('redoBtn').hidden=!miss.length;
  R.missIds=miss.map(x=>x.id);
  show('result');
}

/* ── 事件 ── */
$('startBtn').onclick=()=>{const l=pick();if(l.length)startRound(l.map(q=>q.id))};
$('resumeBtn').onclick=()=>{R=load(RKEY,null);R.orders=R.orders||{};show('quiz');renderQ()};
$('nextBtn').onclick=next;
$('quitBtn').onclick=finish;
$('againBtn').onclick=()=>{const l=pick();if(l.length)startRound(l.map(q=>q.id));else{renderHome();show('home')}};
$('redoBtn').onclick=()=>startRound(shuffle(R.missIds));
$('homeBtn').onclick=()=>{renderHome();show('home')};
$('resetBtn').onclick=()=>{$('resetConfirm').hidden=false;$('resetBtn').hidden=true};
$('resetNo').onclick=()=>{$('resetConfirm').hidden=true;$('resetBtn').hidden=false};
$('resetYes').onclick=()=>{S={};save(KEY,S);try{localStorage.removeItem(RKEY)}catch(e){}$('resetConfirm').hidden=true;$('resetBtn').hidden=false;renderHome()};
document.addEventListener('keydown',e=>{
  if($('quiz').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  const answered=R&&R.res.length>R.i;
  if(answered&&e.key==='Enter'){e.preventDefault();next();return}
  if(!answered&&curQ().t==='m'){const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());
    if(k>=0){const b=$('qBody').querySelectorAll('.choice')[k];if(b)b.click()}}
});
renderHome();
})();
</script>
